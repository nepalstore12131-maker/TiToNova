<div style="margin:0;padding:40px 16px;background:#f6f7f2;font-family:Arial,Helvetica,sans-serif;color:#183b35">
  <div style="max-width:480px;margin:0 auto;padding:32px;background:#ffffff;border:1px solid #e2e9e2;border-radius:16px">
    <p style="margin:0 0 12px;color:#167a64;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase">Titonova</p>
    <h1 style="margin:0 0 12px;font-size:26px">Verify your email</h1>
    <p style="margin:0 0 24px;color:#62756f;line-height:1.6">Enter this six-digit code on Titonova to confirm your email and activate your account.</p>
    <div style="padding:18px;border-radius:12px;background:#edf5ef;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px">{{ .Token }}</div>
    <p style="margin:24px 0 0;color:#62756f;font-size:13px;line-height:1.6">If you didn’t create a Titonova account, you can ignore this email.</p>
  </div>
</div>
